[project]
name = "vcut"
version = "0.1.0"
description = "Retake-aware cutter for synced talking-head + screen-recording videos"
requires-python = ">=3.12,<3.13"
dependencies = [
    "whisperx",
    "rapidfuzz",
    "numpy",
    "scipy",
    "soundfile",
    "mlx-whisper>=0.4.3",
]

[project.scripts]
vcut = "vcut.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vcut"]
